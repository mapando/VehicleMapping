services:
  app:
    build: .
    restart: unless-stopped
    environment:
      VM_API_TOKEN: ${VM_API_TOKEN:?set VM_API_TOKEN in .env}
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      VM_DOMAIN: ${VM_DOMAIN:?set VM_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
